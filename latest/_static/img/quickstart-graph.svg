f-sub"><circle r="13" class="mf-port-bg"/><use href="#mfg0-map-roll" x="-7.5" y="-7.5" width="14.9" height="14.9"/><text x="18" y="4" class="mf-sub-label">BayesianMap</text></g><circle r="13" class="mf-port-bg"/><use href="#mfg0-map-fold" x="-7.5" y="-7.5" width="14.9" height="14.9"/></g></g><g class="mf-node mf-proc" data-id="threshold_0" tabindex="0" aria-label="Threshold"><circle cx="90.0" cy="435.0" r="34" class="mf-body"/><text x="90.0" y="440.5" text-anchor="middle" class="mf-code">TH</text><text x="136.0" y="440.0" class="mf-name">Threshold</text><g class="mf-port" style="--mf-fam:#470f51" transform="translate(90.0 401.0)"><title>Map family: BayesianMap</title><g class="mf-sub"><circle r="13" class="mf-port-bg"/><use href="#mfg0-map-roll" x="-7.5" y="-7.5" width="14.9" height="14.9"/><text x="18" y="4" class="mf-sub-label">BayesianMap</text></g><circle r="13" class="mf-port-bg"/><use href="#mfg0-map-fold" x="-7.5" y="-7.5" width="14.9" height="14.9"/></g><g class="mf-port" style="--mf-fam:#31b7bc" transform="translate(90.0 469.0)"><title>Location family: Observation</title><g class="mf-sub"><circle r="13" class="mf-port-bg"/><use href="#mfg0-observation-marker" x="-7.5" y="-7.5" width="14.9" height="14.9"/><text x="18" y="4" class="mf-sub-label">Observation</text></g><circle r="13" class="mf-port-bg"/><use href="#mfg0-location-marker" x="-7.5" y="-7.5" width="14.9" height="14.9"/></g></g><g class="mf-node mf-io" data-id="locationoutput_0" tabindex="0" aria-label="LocationOutput"><path d="M124.0 580.0 V603.6 Q124.0 610.6 117.0 610.6 H63.0 Q56.0 610.6 56.0 603.6 V580.0 A34 34 0 0 1 124.0 580.0 Z" class="mf-body"/><text x="90.0" y="585.5" text-anchor="middle" class="mf-code">LO</text><text x="136.0" y="585.0" class="mf-name">LocationOutput</text><g class="mf-port" style="--mf-fam:#31b7bc" transform="translate(90.0 546.0)"><title>Location family: Location</title><g class="mf-sub"><circle r="13" class="mf-port-bg"/><use href="#mfg0-location-marker" x="-7.5" y="-7.5" width="14.9" height="14.9"/><text x="18" y="4" class="mf-sub-label">Location</text></g><circle r="13" class="mf-port-bg"/><use href="#mfg0-location-marker" x="-7.5" y="-7.5" width="14.9" height="14.9"/></g></g><style>/* Styles of Fusion Graph SVGs (class mf-fg). Family colors are set per element as --mf-fam. */

symbol [stroke-width] { stroke-width: 5; }

.mf-fg { font-family: inherit; overflow: visible; --mf-ink: #2f3439; }
.mf-fg text { fill: var(--mf-ink); }
.mf-fg .mf-node { outline: none; }

/* Nodes: Input/Output nodes white with a dark outline, processing nodes grey */
.mf-fg .mf-body { fill: white; stroke: var(--mf-ink); stroke-width: 2.5; filter: drop-shadow(0 3px 5px rgb(0 0 0 / 0.15)); }
.mf-fg .mf-proc .mf-body { fill: #e9ecee; stroke: #b9c0c5; stroke-width: 1.5; }
.mf-fg .mf-code { font-size: 16px; font-weight: 700; }

/* Full name, hidden until the node is hovered or focused, then slides out to the right */
.mf-fg .mf-name {
    font-size: 15px; font-weight: 600; opacity: 0; transform: translateX(-24px); pointer-events: none;
    paint-order: stroke; stroke: white; stroke-width: 5px; stroke-linejoin: round;
    transition: opacity 200ms ease, transform 250ms ease;
}
.mf-fg .mf-node:is(:hover, :focus) .mf-name { opacity: 1; transform: none; }

/* Edges in the color of the data family they carry */
.mf-fg .mf-edge path { fill: none; stroke: var(--mf-fam); stroke-width: 2.5; }
.mf-fg .mf-edge circle { fill: var(--mf-fam); }

/* Ports; hovering one slides out a second badge with the concrete data type */
.mf-fg .mf-port { color: var(--mf-fam); cursor: help; }
.mf-fg .mf-port-bg { fill: white; stroke: var(--mf-fam); stroke-width: 2; }
.mf-fg .mf-sub { opacity: 0; transition: transform 250ms ease, opacity 250ms ease; }
.mf-fg .mf-port:is(:hover, :focus-within) .mf-sub { opacity: 1; transform: translateX(26px); }
.mf-fg .mf-sub-label {
    font-size: 11px; font-weight: 600; fill: var(--mf-fam);
    paint-order: stroke; stroke: white; stroke-width: 4px;
}

/* Set by graph.js: fade out everything not connected to the hovered node */
.mf-fg :is(.mf-node, .mf-edge) { transition: opacity 200ms; }
.mf-fg.is-focused :is(.mf-node, .mf-edge):not(.is-related) { opacity: 0.25; }
</style><script><![CDATA[// Fusion Graph SVGs (class mf-fg): fade out everything not connected to the hovered or focused node.
// Safe to load more than once: each graph is set up only once.
(() => {
  function setUp(svg) {
    svg.dataset.mfReady = "true";
    const edges = [...svg.querySelectorAll(".mf-edge")];
    const clear = () => {
      svg.classList.remove("is-focused");
      svg.querySelectorAll(".is-related").forEach(el => el.classList.remove("is-related"));
    };
    svg.querySelectorAll(".mf-node").forEach(node => {
      const focus = () => {
        clear();
        svg.classList.add("is-focused");
        node.classList.add("is-related");
        for (const edge of edges) {
          const { from, to } = edge.dataset;
          if (from !== node.dataset.id && to !== node.dataset.id) continue;
          edge.classList.add("is-related");
          const other = from === node.dataset.id ? to : from;
          svg.querySelector(`.mf-node[data-id="${other}"]`).classList.add("is-related");
        }
      };
      node.addEventListener("mouseenter", focus);
      node.addEventListener("focus", focus);
      node.addEventListener("mouseleave", clear);
      node.addEventListener("blur", clear);
    });
  }

  const setUpAll = () => document.querySelectorAll("svg.mf-fg:not([data-mf-ready])").forEach(setUp);
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", setUpAll);
  } else {
    setUpAll();
  }
})();
]]></script></svg>