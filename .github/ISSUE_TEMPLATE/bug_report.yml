name: Bug report
description: Something does not work as documented
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please check the [open issues](https://github.com/mufasa-fusion/mufasa-fusion/issues) first to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A short description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: A minimal code example or the steps that lead to the bug. Please do not include sensitive data or real site coordinates.
      render: python
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error message or traceback
      description: If there is one, paste it here.
      render: text

  - type: input
    id: version
    attributes:
      label: MuFASA version
      description: Output of `pip show mufasa-fusion`
      placeholder: e.g. 0.1.2
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Python version and operating system
      placeholder: e.g. Python 3.12, Windows 11
