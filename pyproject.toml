[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mufasa-fusion"
description = "Multi-modal geospatial data fusion framework"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
dynamic = ["version"]

requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "shapely",
    "numpy",
    "rasterio",
    "pyproj",
    "scipy",
]

[project.optional-dependencies]
tracking = [
    "stonesoup",
    "river",
]
vis = [
    "matplotlib",
    "contextily",
    "geopandas",
]
dev = [
    "pytest",
    "pytest-cov",
    "mufasa-fusion[tracking,vis]",
]
docs = [
    "sphinx",
    "sphinx-autoapi",
    "shibuya",
    "myst-nb",
    "sphinx-copybutton",
    # For examples
    "paho-mqtt",
    "amqtt",
]

[project.urls]
homepage = "https://mufasa-fusion.org"
documentation = "https://mufasa-fusion.org"
source = "https://github.com/mufasa-fusion/mufasa-fusion"
issues = "https://github.com/mufasa-fusion/mufasa-fusion/issues"

[tool.setuptools.dynamic]
version = {attr = "mufasa.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mufasa.graph_svg" = ["*.css", "*.js", "icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/mufasa"]
