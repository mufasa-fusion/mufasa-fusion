[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mufasa-fusion"
version = "0.1.2"
description = "Multi-modal geospatial data fusion framework"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "shapely",
    "numpy",
    "rasterio",
    "pyproj",
    "scipy",
]

[project.optional-dependencies]
tracking = [
    "stonesoup",
    "river",
]
vis = [
    "matplotlib",
    "contextily",
    "geopandas",
]
dev = [
    "pytest",
    "pytest-cov",
    "mufasa-fusion[tracking,vis]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/mufasa"]
